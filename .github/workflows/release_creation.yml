name: Release Creation

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read

  release:
    needs: [tests, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches integration version
        run: |
          version=$(python -c "import json; print(json.load(open('custom_components/fan_controller/manifest.json'))['version'])")
          expected_tag="v$version"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $expected_tag." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
